name: Offline checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Validate notebook structure and Python syntax
        run: |
          python - <<'PY'
          import ast
          import nbformat
          notebook = nbformat.read("notebooks/01_foundry_chat.ipynb", as_version=4)
          nbformat.validate(notebook)
          for cell in notebook.cells:
              if cell.cell_type == "code":
                  ast.parse(cell.source)
          PY
